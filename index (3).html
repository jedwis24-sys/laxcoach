px 8px;border-bottom:1px solid var(--line)}.scroll{overflow-x:auto}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}.progress{height:7px;background:#334353;border-radius:10px;overflow:hidden}.progress>div{background:var(--lime);height:100%}.feed{max-height:300px;overflow:auto}.feed div{padding:9px 0;border-bottom:1px solid var(--line)}.choice{display:block;width:100%;text-align:left;background:#223345;color:var(--text);margin:8px 0}.choice:hover{background:#37536a}.tiny{font-size:12px}.hidden{display:none}.hero{padding:24px;background:linear-gradient(120deg,#213f43,#141e2b);border:1px solid #3c6158;border-radius:13px;margin-bottom:15px}@media(max-width:750px){.grid,.two{grid-template-columns:1fr}header strong{font-size:19px}h1{font-size:24px}}

body{font-family:Arial,Helvetica,sans-serif}header{background:#17232b;border-bottom:3px solid #bd9d62}h1,h2{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.035em}nav{border-bottom:2px solid #bd9d62}button{border-radius:2px!important} .card{border-radius:2px!important;box-shadow:none!important}.pill{border-radius:2px!important}.stat{font-family:Georgia,serif}.editorhead{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:20px 0}.editorhead h2{font-size:32px;margin:6px 0}.calendarpaper{background:#e9e5d9;color:#17232b;border:1px solid #bcb6a6;padding:16px;box-shadow:5px 5px 0 #080e14}.calmonth{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:3px double #17232b;padding:0 0 12px;margin-bottom:8px}.calmonth strong{font-family:Georgia,serif;font-size:23px}.calmonth span{font-size:11px;color:#5b625f}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:#b8b5ac;border:1px solid #b8b5ac}.calweekday{background:#17232b;color:#e9e5d9;padding:9px 3px;text-align:center;font-size:10px;letter-spacing:1px}.calcell{min-height:88px;padding:7px!important;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:7px;background:#f8f5ed!important;color:#17232b!important;border:0!important;min-width:0;white-space:normal}.calcell b{font-family:Georgia,serif;font-size:17px}.calcell small{font-size:10px;overflow-wrap:anywhere;color:#68716f}.calcell .game{color:#913d31;font-weight:bold}.calcell.today{outline:3px solid #9d7434;outline-offset:-3px;background:#fff2cd!important}.calcell.past{opacity:.48}.calcell.empty{background:#d8d5cb!important}.calcell:disabled{cursor:default}.calcell:not(:disabled):hover{background:#e9dcc0!important}@media(max-width:650px){.editorhead,.calmonth{flex-direction:column;align-items:flex-start}.calcell{min-height:65px;padding:4px!important}.calcell small{font-size:8px}.calendarpaper{padding:6px}}
</style></head><body><header><strong>SIDELINE<span> // LAX</span></strong><span class="sub" id="topline">HIGH SCHOOL HEAD COACH DYNASTY</span></header><main class="wrap" id="app"></main><script>
'use strict';const KEY='sideline_lax_v1';const schools=[
{name:'West Chester Public',state:'PA',type:'Public',league:'Ches-Mont',prestige:28,quality:63,budget:38},
{name:'Central Bucks Public',state:'PA',type:'Public',league:'Suburban One',prestige:40,quality:70,budget:48},
{name:'Manhasset',state:'NY',type:'Public',league:'Nassau County',prestige:89,quality:89,budget:72},
{name:'St. Joseph’s Prep',state:'PA',type:'Private',league:'Philadelphia Catholic League',prestige:70,quality:80,budget:72},
{name:'La Salle College High School',state:'PA',type:'Private',league:'Philadelphia Catholic League',prestige:85,quality:87,budget:82},
{name:'Malvern Prep',state:'PA',type:'Private',league:'Inter-Ac',prestige:91,quality:91,budget:90},
{name:'Haverford School',state:'PA',type:'Private',league:'Inter-Ac',prestige:94,quality:92,budget:90},
{name:'Delbarton',state:'NJ',type:'Private',league:'NJ Non-Public',prestige:91,quality:90,budget:85},
{name:'Boys’ Latin',state:'MD',type:'Private',league:'MIAA',prestige:96,quality:94,budget:92},
{name:'St. Anthony’s',state:'NY',type:'Private',league:'CHSAA',prestige:95,quality:93,budget:91},
{name:'The Hill School',state:'PA',type:'Prep',league:'MAPL',prestige:78,quality:84,budget:88},
{name:'Perkiomen School',state:'PA',type:'Prep',league:'Independent',prestige:67,quality:79,budget:79},
{name:'Culver Academy',state:'IN',type:'Prep',league:'Independent',prestige:98,quality:96,budget:98}];
const first=['Jack','Ryan','Cole','Matt','Tyler','Connor','Danny','Aidan','Brady','Luke','Sean','Ben','Owen','Liam','Nate','Cam','Drew','Evan','Jake','Will','Noah','Miles','Chris','Finn'];const last=['Murphy','Sullivan','Brennan','Miller','O’Brien','McCarthy','Kelly','Ryan','Davis','Walsh','Burke','Fitzgerald','Reilly','Hughes','Smith','Collins','Doyle','Hart','Moran','Brooks'];const positions=['A','A','A','M','M','M','M','M','D','D','D','D','LSM','FOGO','G'];let G=null,tab='home';const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const pick=a=>a[rand(0,a.length-1)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const avg=a=>Math.round(a.reduce((s,v)=>s+v,0)/(a.length||1));function makePlayer(base,grade){let pos=pick(positions),ovr=clamp(Math.round(base+rand(-15,12)),45,97);return{id:Math.random().toString(36).slice(2),name:pick(first)+' '+pick(last),pos,grade:grade||rand(9,12),ovr,potential:clamp(ovr+rand(3,20),ovr,99),work:rand(35,98),club:pick(['Local','Regional','Elite','None']),fatigue:0,stats:{g:0,a:0,sv:0,fo:0}}}function mySchool(){return schools[G.school]}function teamOVR(){return avg(G.roster.map(p=>p.ovr))}function save(){localStorage.setItem(KEY,JSON.stringify(G))}function note(s){G.news.unshift('Season '+G.year+' · '+s);G.news=G.news.slice(0,45)}function button(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function box(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}function resetStats(){G.roster.forEach(p=>p.stats={g:0,a:0,sv:0,fo:0})}function start(){let id=+document.querySelector('#school').value,coach=document.querySelector('#coach').value.trim()||'Coach';let s=schools[id];G={school:id,coach,year:2027,week:0,wins:0,losses:0,prestige:s.prestige,budget:s.budget,chemistry:60,roster:Array.from({length:29},()=>makePlayer(s.quality)),schedule:[],news:[],practice:[],practiceCount:0,development:0,retention:50,clubFocus:'Balanced',recruits:[],offers:[],championships:0,history:[]};makeSchedule();makeRecruits();note('Welcome, '+coach+'. You have been hired by '+s.name+'.');save();tab='home';render()}
function makeSchedule(){let s=mySchool(),pool=schools.map((x,i)=>({...x,id:i})).filter(x=>x.id!==G.school);let near=pool.filter(x=>x.state===s.state);let mandatory=near.filter(x=>x.league===s.league);let other=near.filter(x=>!mandatory.some(m=>m.id===x.id));let list=[];for(let i=0;i<6;i++){let opp=mandatory.length?mandatory[i%mandatory.length]:other[i%other.length];if(!opp)opp=pick(pool);list.push({name:opp.name,quality:opp.quality,prestige:opp.prestige,locked:true,type:i<3?'League / district':'Local',played:false})}while(list.length<10){let opp=pick(other.length?other:pool);list.push({name:opp.name,quality:opp.quality,prestige:opp.prestige,locked:false,type:'Nonconference',played:false})}G.schedule=list;G.week=0;G.day=0;G.lastPracticeDay=-1;G.schedule.forEach((g,i)=>g.day=14+i*7);G.wins=0;G.losses=0;G.practiceCount=0;G.practice=[];resetStats()}
function makeRecruits(){G.recruits=Array.from({length:7},()=>{let p=makePlayer(mySchool().quality-7,9);return {...p,interest:rand(28,80),target:pick(schools.filter(s=>s.type!=='Public')).name}})}
function nextGame(){return G.schedule.findIndex(x=>!x.played)}function runPractice(){if(nextGame()<0||G.practiceCount>=4||G.lastPracticeDay===G.day||G.day>=G.schedule[nextGame()].day)return;let vals=[...document.querySelectorAll('.drill')].map(x=>x.value),intensity=document.querySelector('#intensity').value;let load={Light:3,Balanced:7,Hard:13}[intensity];let boost=vals.includes('Recovery')?-5:load;G.roster.forEach(p=>{p.fatigue=clamp(p.fatigue+boost-rand(1,4),0,90);let fit=(vals.includes('Stickwork')&&(p.pos==='A'||p.pos==='M'))||(vals.includes('Defense')&&(p.pos==='D'||p.pos==='LSM'))||(vals.includes('Faceoffs')&&p.pos==='FOGO')||(vals.includes('Goalies')&&p.pos==='G');if(Math.random()<(.06+(fit?.09:0))*(intensity==='Light'?.6:1)&&p.ovr<p.potential)p.ovr++});G.lastPracticeDay=G.day;G.practiceCount++;G.development+=vals.includes('Film')?2:1;G.chemistry=clamp(G.chemistry+(vals.includes('6v6')?2:1),0,99);G.practice=vals;note('Practice completed: '+vals.join(', ')+' ('+intensity+').');save();render()}
function simGame(){let i=nextGame();if(i<0||G.day<G.schedule[i].day)return;let g=G.schedule[i];let fatigue=avg(G.roster.map(p=>p.fatigue));let strength=teamOVR()+(G.chemistry-60)*.09+Math.min(G.practiceCount,4)*1.1-fatigue*.14;let diff=strength-g.quality;let winChance=clamp(.5+diff*.019,.08,.92);let won=Math.random()<winChance;let own=rand(6,15),opp=clamp(own+(won?-rand(1,6):rand(1,6)),2,22);if(!won){let t=own;own=opp;opp=t}g.played=true;g.our=own;g.their=opp;G.wins+=won?1:0;G.losses+=won?0:1;let attackers=G.roster.filter(p=>['A','M'].includes(p.pos)).sort((a,b)=>b.ovr-a.ovr).slice(0,10);for(let k=0;k<own;k++){let p=pick(attackers);p.stats.g++;if(Math.random()<.75)pick(attackers).stats.a++}let goalie=G.roster.find(p=>p.pos==='G');if(goalie)goalie.stats.sv+=rand(5,16);G.roster.forEach(p=>p.fatigue=clamp(p.fatigue+rand(3,9),0,90));let prestigeDelta=won?(g.prestige>G.prestige+15?3:1):(g.prestige<G.prestige-20?-2:0);G.prestige=clamp(G.prestige+prestigeDelta,0,99);G.practiceCount=0;note((won?'WIN':'LOSS')+' '+own+'–'+opp+' vs '+g.name+'.');save();render()}
function scheduleRequest(id){let s=schools[id],mine=mySchool(),gap=Math.abs(G.prestige-s.prestige),distance=mine.state===s.state?0:mine.state==='IN'||s.state==='IN'?35:12;let chance=clamp(90-gap*1.5-distance+(G.wins-G.losses)*2,5,90);let idx=G.schedule.findIndex(g=>!g.locked&&!g.played);if(idx<0)return;if(Math.random()*100<chance){G.schedule[idx]={name:s.name,quality:s.quality,prestige:s.prestige,locked:false,type:'Scheduled request',played:false};note(s.name+' accepted your nonconference game request.')}else note(s.name+' declined your scheduling request (fit, travel or competitive priorities).');save();render()}
function invest(which){if(G.budget<8)return;G.budget-=8;if(which==='pipeline'){G.retention=clamp(G.retention+12,0,100);note('Invested in open youth clinics and the local pipeline.')}if(which==='facilities'){G.development+=6;G.chemistry=clamp(G.chemistry+3,0,99);note('Improved practice equipment and facilities.')}if(which==='staff'){G.development+=9;note('Hired additional player-development support.')}save();render()}
function recruit(id){let p=G.recruits.find(p=>p.id===id);if(!p)return;if(mySchool().type==='Public'){p.interest=clamp(p.interest+rand(3,9)+Math.round(G.retention/25),0,100);note('Your community pipeline improved '+p.name+'’s likelihood of staying local.')}else{p.interest=clamp(p.interest+rand(7,16),0,100);note('Admissions outreach increased '+p.name+'’s interest.')}save();render()}
function offseason(){if(nextGame()>=0)return;let result={year:G.year,wins:G.wins,losses:G.losses};G.history.unshift(result);let championship=G.wins>=9&&G.losses<=1&&Math.random()<.45;if(championship){G.championships++;G.prestige=clamp(G.prestige+5,0,99)}let seniors=G.roster.filter(p=>p.grade===12);G.roster=G.roster.filter(p=>p.grade<12);G.roster.forEach(p=>{p.grade++;let club=p.club==='Elite'?3:p.club==='Regional'?2:p.club==='Local'?1:0;let gain=clamp(Math.round(rand(0,3)+p.work/45+club*.6+G.development/20),0,8);p.ovr=Math.min(p.potential,p.ovr+gain);p.fatigue=0});let incoming=0;for(let p of G.recruits){let roll=rand(1,100);if(roll<=p.interest+(mySchool().type==='Public'?Math.round(G.retention/10):0)){p.grade=9;p.stats={g:0,a:0,sv:0,fo:0};p.fatigue=0;G.roster.push(p);incoming++}}while(G.roster.length<27)G.roster.push(makePlayer(mySchool().quality-7,9));let departures=0;G.roster=G.roster.filter(p=>{if(p.grade>9&&Math.random()<(mySchool().type==='Public'?.055:.035)){departures++;return false}return true});while(G.roster.length<25)G.roster.push(makePlayer(mySchool().quality-10,9));G.year++;G.day=0;G.lastPracticeDay=-1;G.budget=clamp(G.budget+12,0,100);G.development=0;G.chemistry=clamp(G.chemistry-12,35,90);G.retention=clamp(G.retention-5,10,100);makeSchedule();makeRecruits();note('Offseason: '+seniors.length+' seniors graduated, '+incoming+' pipeline prospects enrolled, '+departures+' players transferred out.'+(championship?' Championship season!':''));save();render()}
function layout(content){let s=mySchool();document.querySelector('#topline').textContent=`${s.name.toUpperCase()} · ${G.year}`;let tabs=[['home','Dashboard'],['calendar','Calendar'],['roster','Roster'],['practice','Practice'],['schedule','Schedule'],['pipeline',s.type==='Public'?'Local Pipeline':'Recruiting'],['program','Program'],['history','History']];document.querySelector('#app').innerHTML=`<div class="row"><div><div class="sub">${esc(s.type.toUpperCase())} · ${esc(s.state)} · ${esc(s.league)}</div><h1>${esc(s.name)}</h1><span class="pill">Head Coach ${esc(G.coach)}</span></div><div class="stack"><span class="pill">${G.year} SEASON · ${displayDate(G.day)}</span>${button('Save', 'save();alert("Saved on this device")','secondary')}</div></div><nav>${tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</nav>${content}`}
function render(){if(!G){document.querySelector('#topline').textContent='HIGH SCHOOL HEAD COACH DYNASTY';document.querySelector('#app').innerHTML=`<div class="hero"><div class="sub">BUILD THE PROGRAM. OWN THE SIDELINE.</div><h1>Your coaching career starts here.</h1><p>Run practices, develop local players, recruit where permitted, negotiate schedules and build a high school lacrosse dynasty.</p></div><section class="card"><h2>Create Your Coach</h2><label>Coach Name</label><input id="coach" placeholder="Coach Williams" maxlength="40"><label>Choose Your School</label><select id="school">${schools.map((s,i)=>`<option value="${i}">${esc(s.name)} — ${s.type} (${s.state})</option>`).join('')}</select><p class="sub">Schools and ratings are a fictionalized gameplay model. League/eligibility rules are simplified, not official.</p>${button('Start Dynasty','start()')}</section>`;return}if(tab==='home')home();if(tab==='calendar')calendar();if(tab==='roster')roster();if(tab==='practice')practice();if(tab==='schedule')schedule();if(tab==='pipeline')pipeline();if(tab==='program')program();if(tab==='history')history()}
function home(){let i=nextGame(),n=G.schedule[i];layout(`<div class="grid"><div class="card"><div class="sub">RECORD</div><div class="stat">${G.wins}–${G.losses}</div></div><div class="card"><div class="sub">TEAM OVERALL</div><div class="stat">${teamOVR()}</div></div><div class="card"><div class="sub">PROGRAM PRESTIGE</div><div class="stat">${G.prestige}</div></div></div><div class="two">${box('Next Game',n?`<p><strong>vs ${esc(n.name)}</strong></p><p class="sub">Opponent OVR ${n.quality} · ${esc(n.type)} · Game ${i+1} of ${G.schedule.length}</p><p>Practices since last game: ${G.practiceCount} · Team fatigue: ${avg(G.roster.map(p=>p.fatigue))}</p><div class="stack">${G.day>=n.day?button('Play / Simulate Game','simGame()'):button('Advance to Game','advanceTo('+n.day+')')}${button('Prepare Practice',"tab='practice';render()",'secondary')}${button('Calendar',"tab='calendar';render()",'secondary')}</div>`:`<p>Regular season complete: ${G.wins}–${G.losses}</p>${button('Advance to Next Season','offseason()')}`)}${box('Coach Inbox / News',`<div class="feed">${G.news.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`)}</div><p class="sub">Prototype: game results use team quality, fatigue, chemistry and preparation. State postseason brackets and live on-field decisions are not yet implemented.</p>`)}
function roster(){let players=[...G.roster].sort((a,b)=>b.ovr-a.ovr);layout(box('Varsity Roster · '+players.length+' Players',`<div class="scroll"><table><thead><tr><th>Player</th><th>Pos</th><th>Grade</th><th>OVR</th><th>Work</th><th>Club</th><th>G</th><th>A</th></tr></thead><tbody>${players.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.pos}</td><td>${p.grade}</td><td><strong>${p.ovr}</strong></td><td>${p.work}</td><td>${p.club}</td><td>${p.stats.g}</td><td>${p.stats.a}</td></tr>`).join('')}</tbody></table></div><p class="sub">Potential is hidden. Seniors graduate after the season; underclassmen improve based on work ethic, club participation and program development.</p>`))}
function practice(){let opts=['Stickwork','Ground Balls','6v6','Defense','Clearing','Riding','Faceoffs','Goalies','Film','Recovery'];layout(box('Design a Practice',`<p>Choose three practice blocks. Your plan improves development and game preparation, but fatigue accumulates.</p><div class="grid">${[0,1,2].map(i=>`<div><label>Block ${i+1}</label><select class="drill">${opts.map((o,j)=>`<option ${j===[0,2,8][i]?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div><label>Intensity</label><select id="intensity"><option>Light</option><option selected>Balanced</option><option>Hard</option></select><p class="sub">No more than 4 practices between games. A Recovery block helps manage fatigue.</p>${button('Run Practice','runPractice()',G.practiceCount>=4||nextGame()<0?'secondary':'')} ${G.practiceCount>=4?'<span class="warn">Practice limit reached for this game.</span>':''}<p>Practices this game: ${G.practiceCount}/4 · Chemistry: ${G.chemistry}/99 · Average fatigue: ${avg(G.roster.map(p=>p.fatigue))}</p>`)+box('Training Notes',`<p>Club lacrosse and individual offseason work affect player growth at the end of each season. Investing in staff and facilities adds a development bonus.</p>`));document.querySelectorAll('button').forEach(b=>{if(b.textContent==='Run Practice'&&G.practiceCount>=4)b.disabled=true})}
function schedule(){let open=nextGame();layout(box('Season Schedule',`<div class="scroll"><table><tr><th>#</th><th>Opponent</th><th>Type</th><th>OVR</th><th>Result</th></tr>${G.schedule.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.name)}</td><td>${esc(g.type)}</td><td>${g.quality}</td><td>${g.played?`${g.our}–${g.their}`:i===open?'NEXT':'—'}</td></tr>`).join('')}</table></div>`)+box('Request a Nonconference Game',`<p>Only unplayed nonconference slots can be replaced. Elite programs are unlikely to accept requests from unknown programs, especially across long distances.</p><label>Opponent</label><select id="opp">${schools.map((s,i)=>i===G.school?'':`<option value="${i}">${esc(s.name)} · Prestige ${s.prestige} · ${s.state}</option>`).join('')}</select> ${button('Send Request','scheduleRequest(+document.querySelector("#opp").value)',open<0?'secondary':'')}<p class="sub">Opponent acceptance considers prestige, location and recent results. This is a simplified fictional schedule, not a verified official fixture list.</p>`));if(open<0||!G.schedule.some(g=>!g.locked&&!g.played)){let b=[...document.querySelectorAll('button')].find(b=>b.textContent==='Send Request');if(b)b.disabled=true}}
function pipeline(){let pub=mySchool().type==='Public';layout(box(pub?'Local Talent & Retention':'Admissions & Player Recruiting',`<p>${pub?'You cannot directly recruit outside your attendance area. Invest in open youth clinics, improve the program and retain hometown players.':'Scout prospective students and improve their interest in your school. Prep programs can also receive eligible postgraduate players through offseason roster generation.'}</p><div class="scroll"><table><tr><th>Prospect</th><th>Pos</th><th>OVR</th><th>Interest</th><th>Other Interest</th><th></th></tr>${G.recruits.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.pos}</td><td>${p.ovr}</td><td>${p.interest}%</td><td>${esc(p.target)}</td><td>${button(pub?'Build Local Connection':'Admissions Outreach',`recruit('${p.id}')`,'secondary')}</td></tr>`).join('')}</table></div><p class="sub">Decisions are resolved in the offseason. Transfers and eligibility are abstracted; real-world athletic-association restrictions vary.</p>`))}
function program(){layout(`<div class="grid"><div class="card"><div class="sub">AVAILABLE RESOURCES</div><div class="stat">${G.budget}</div></div><div class="card"><div class="sub">LOCAL RETENTION</div><div class="stat">${G.retention}</div></div><div class="card"><div class="sub">DEVELOPMENT INVESTMENT</div><div class="stat">${G.development}</div></div></div>${box('Build Your Program',`<p>Each investment costs 8 resource points. Resources replenish between seasons.</p><div class="stack">${button('Youth Clinics / Pipeline · 8',"invest('pipeline')")}${button('Facilities · 8',"invest('facilities')")}${button('Coaching Staff · 8',"invest('staff')")}</div><p class="sub">Public schools focus on retaining local players; private and prep schools can combine admissions outreach with development.</p>`)}${box('Dynasty Controls',`${button('Save Game','save();alert("Saved on this device")','secondary')} ${button('Start New Career','if(confirm("Delete this career on this device?")){localStorage.removeItem(KEY);G=null;render()}','secondary')}`)}`);if(G.budget<8)[...document.querySelectorAll('button')].filter(b=>b.textContent.includes('· 8')).forEach(b=>b.disabled=true)}

const baseDate=year=>new Date(year,2,1,12);
function dateAt(day){let d=baseDate(G.year);d.setDate(d.getDate()+day);return d}
function displayDate(day){return dateAt(day).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function advanceTo(target){let next=nextGame();if(next>=0)target=Math.min(target,G.schedule[next].day);if(target<=G.day)return;let delta=target-G.day;G.roster.forEach(p=>p.fatigue=clamp(p.fatigue-Math.floor(delta*1.6),0,90));G.day=target;note('Calendar advanced '+delta+' day'+(delta===1?'':'s')+' to '+displayDate(G.day)+'.');save();render()}
function calendar(){let now=dateAt(G.day),month=now.getMonth(),year=now.getFullYear(),first=new Date(year,month,1,12),last=new Date(year,month+1,0,12).getDate(),offset=first.getDay();let next=nextGame(),upcoming=G.schedule[next];let cells=Array.from({length:Math.ceil((offset+last)/7)*7},(_,i)=>{let n=i-offset+1;if(n<1||n>last)return '<div class="calcell empty"></div>';let date=new Date(year,month,n,12),day=Math.round((date-baseDate(G.year))/86400000),g=G.schedule.find(x=>x.day===day),current=day===G.day;return `<button class="calcell ${current?'today':''} ${day<G.day?'past':''}" ${day<G.day||day>G.day+120?'disabled':''} onclick="advanceTo(${day})"><b>${n}</b>${g?`<small class="game">${g.played?'FINAL':'GAME'} · ${esc(g.name)}</small>`:date.getDay()===0?'<small>REST</small>':date.getDay()===6?'<small>OPEN / CLUB</small>':'<small>TRAINING</small>'}</button>`}).join('');layout(`<div class="editorhead"><div><div class="sub">COACHING OFFICE / OPERATIONS</div><h2>THE CALENDAR</h2><p class="sub">${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</p></div><div class="stack">${button('Next Day','advanceTo(G.day+1)','secondary')}${button('Next Week','advanceTo(G.day+7)','secondary')}${upcoming?button('Next Game','advanceTo('+upcoming.day+')'):''}</div></div><div class="calendarpaper"><div class="calmonth"><strong>${now.toLocaleDateString('en-US',{month:'long',year:'numeric'}).toUpperCase()}</strong><span>Click a future date to advance · Game dates stop simulation</span></div><div class="calgrid">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(x=>`<div class="calweekday">${x}</div>`).join('')}${cells}</div></div><p class="sub">Practice can be run once per day, up to four times before each game. Advancing time recovers fatigue. Game days stop automatic progression until you simulate the matchup.</p>`)}

function history(){layout(box('Coaching Career',`<div class="grid"><div><div class="sub">SEASONS COMPLETED</div><div class="stat">${G.history.length}</div></div><div><div class="sub">CHAMPIONSHIP SEASONS</div><div class="stat">${G.championships}</div></div><div><div class="sub">CURRENT PRESTIGE</div><div class="stat">${G.prestige}</div></div></div><div class="scroll"><table><tr><th>Season</th><th>Wins</th><th>Losses</th></tr>${G.history.map(h=>`<tr><td>${h.year}</td><td>${h.wins}</td><td>${h.losses}</td></tr>`).join('')}</table></div>`))}
try{let raw=localStorage.getItem(KEY);if(raw){G=JSON.parse(raw);if(!G||!Array.isArray(G.roster)||!Array.isArray(G.schedule)||!schools[G.school])G=null}}catch(e){G=null}render();
</script></body></html>
